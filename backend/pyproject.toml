[project]
name = "financinio-backend"
version = "0.1.0"
description = "Financinio FastAPI + LangChain + LangGraph + LangSmith financial AI backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "upstash-vector>=0.8.0",
    "langchain>=0.3.14",
    "langchain-core>=0.3.29",
    "langchain-google-genai>=2.0.8",
    "langchain-openai>=0.2.14",
    "langchain-anthropic>=0.3.1",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.10",
    "langsmith>=0.2.10",
    "openpyxl>=3.1.5",
    "pypdf>=5.1.0",
    "httpx>=0.28.0",
    "boto3>=1.44.7",
    "pdfplumber>=0.11.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
