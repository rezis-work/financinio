name: Deploy Backend to Fly.io

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: fly-deploy-financinio-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify & Deploy FastAPI to Fly.io
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies & run pre-deploy checks
        env:
          APP_ENV: test
        run: |
          uv sync --python 3.12 --frozen
          uv run ruff check app tests
          uv run python -m app.ai.evals.run_evals
          uv run pytest -v

      - name: Setup flyctl
        if: ${{ secrets.FLY_API_TOKEN != '' }}
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io Machines
        if: ${{ secrets.FLY_API_TOKEN != '' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false --yes

      - name: Notice when FLY_API_TOKEN is not configured
        if: ${{ secrets.FLY_API_TOKEN == '' }}
        run: |
          echo "Skipping Fly.io deploy: add FLY_API_TOKEN in GitHub Repo Settings -> Secrets -> Actions."
          echo "Generate one locally with: fly tokens create deploy --app financinio-api -x 999999h"
